<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login Modern</title>
    <!-- Memuat Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Memuat Ikon Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Memuat File CSS Eksternal -->
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <div class="container">
        <!-- Panel Kiri: Gambar dan Pesan -->
        <div class="panel panel-left">
            <div class="welcome-section">
                <div class="dot-navigation">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
                <div class="welcome-text">
                    <h1>Welcome to the community</h1>
                    <p>Login to explore.</p>
                </div>
            </div>
        </div>
        
        <!-- Panel Kanan: Formulir Login -->
        <div class="panel panel-right">
            <div class="form-section">
                <h2>Login your account!</h2>
                
                <!-- Tab Pilihan Login -->
                <div class="login-options">
                    <button class="option active">E-mail</button>
                    <button class="option">Mobile Number</button>
                </div>
                
                <form>
                    <!-- Input Email -->
                    <div class="input-group">
                        <i class="far fa-envelope"></i>
                        <input type="email" placeholder="Email" required>
                    </div>
                    
                    <!-- Input Password -->
                    <div class="input-group">
                        <i class="fas fa-key"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    
                    <!-- Lupa Password -->
                    <div class="form-footer">
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    
                    <!-- Tombol Lanjutkan -->
                    <button type="submit" class="btn-primary">Continue</button>
                </form>
                
                <!-- Opsi Login Sosial -->
                <div class="social-login">
                    <p>Or Sign In With</p>
                    <div class="social-icons">
                        <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="social-icon"><i class="fab fa-google"></i></a>
                        <a href="#" class="social-icon"><i class="fab fa-apple"></i></a>
                    </div>
                </div>
                
                <!-- Daftar Akun Baru -->
                <div class="signup-link">
                    <p>Don't have an account? <a href="#">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript Sederhana untuk Dot Navigation -->
    <script>
        const dots = document.querySelectorAll('.dot');
        const welcomeH1 = document.querySelector('.welcome-text h1');
        const welcomeP = document.querySelector('.welcome-text p');
        
        const slides = [
            { h1: "Welcome to the community", p: "Login to explore." },
            { h1: "Build Your Connections", p: "Discover a world of opportunities." },
            { h1: "Unlock All Features", p: "Access exclusive content." },
            { h1: "Join a Vibrant Platform", p: "Engage and grow." }
        ];
        
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                dots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                
                // Ganti teks dengan efek transisi sederhana (opsional)
                welcomeH1.textContent = slides[index].h1;
                welcomeP.textContent = slides[index].p;
            });
        });
    </script>
</body>
</html>
